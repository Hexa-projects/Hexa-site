<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: home-a2-quiet-operation.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ADLaM+Display:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1505px">
  <div class="r-masthead region chrome" data-region="masthead"><!-- white navigation bar with brand, five links and one graphite CTA --></div>
  <div class="r-hero-eyebrow region text" data-region="hero-eyebrow"><!-- small uppercase tracking label REDE EM OPERAÇÃO --><p style="font-size:var(--r-hero-eyebrow-font);line-height:1.05;margin:0">hero-eyebrow</p></div>
  <div class="r-hero-headline region text" data-region="hero-headline"><!-- two-line bold editorial headline Tecnologia médica. Em operação. --><p style="font-size:var(--r-hero-headline-font);font-family:var(--r-hero-headline-family),sans-serif;font-weight:var(--r-hero-headline-weight);line-height:1.05;margin:0">hero-headline</p></div>
  <div class="r-hero-body region text" data-region="hero-body"><!-- three-line supporting paragraph in muted graphite --><p style="line-height:1.05;margin:0">hero-body</p></div>
  <div class="r-hero-primary-action region control" data-region="hero-primary-action"><!-- solid orange primary button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop hero-primary-action); a control need not have button chrome --></div>
  <div class="r-hero-secondary-action region control" data-region="hero-secondary-action"><!-- underlined text action: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop hero-secondary-action); a control need not have button chrome --></div>
  <figure class="r-hero-clinical-photo region plate" data-region="hero-clinical-photo"><img src="../../../assets/plates/hero-clinical-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-evidence-diagnostic region text" data-region="evidence-diagnostic"><!-- Diagnóstico por imagem --><p style="font-size:var(--r-evidence-diagnostic-font);line-height:1.05;margin:0">evidence-diagnostic</p></div>
  <div class="r-evidence-cardiology region text" data-region="evidence-cardiology"><!-- Cardiologia digital --><p style="line-height:1.05;margin:0">evidence-cardiology</p></div>
  <div class="r-evidence-support region text" data-region="evidence-support"><!-- Suporte especializado --><p style="line-height:1.05;margin:0">evidence-support</p></div>
  <div class="r-next-section-marker region chrome" data-region="next-section-marker"><!-- short orange rule --></div>
  <div class="r-next-section-title region text" data-region="next-section-title"><!-- Da escolha à operação. --><p style="font-size:var(--r-next-section-title-font);line-height:1.05;margin:0">next-section-title</p></div>
</main>
</body>
</html>
